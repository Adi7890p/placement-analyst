<!DOCTYPE html>
<html>

<head>

    <title>Student Placement Predictor</title>


    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 60vw;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        input[type=range] {
            width: 100%;
        }

        .slider-value {
            font-weight: bold;
            color: #2c7be5;
        }

        button {
            padding: 12px 20px;
            background: #2c7be5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1a5ed8;
        }

        select {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        /* modal popup */

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 350px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .modal-buttons {
            margin-top: 20px;
            display: flex;
            justify-content: space-around;
        }

        .modal-buttons button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            background: #2c7be5;
            color: white;
            cursor: pointer;
        }

        .modal-buttons button:hover {
            background: #1a5ed8;
        }
    </style>

    <script>

        function updateValue(id, val) {
            document.getElementById(id).innerText = val
        }

        function closeModal() {
            document.getElementById("resultModal").style.display = "none"
        }

        function fillPlacedExample() {
            document.getElementsByName('Age')[0].value = 22; updateValue('age_val', 22);
            document.getElementsByName('CGPA')[0].value = 8.5; updateValue('cgpa_val', '8.5');
            document.getElementsByName('Communication_Skills')[0].value = 9; updateValue('comm_val', 9);
            document.getElementsByName('Coding_Skills')[0].value = 9; updateValue('coding_val', 9);
            document.getElementsByName('Soft_Skills_Rating')[0].value = 9; updateValue('soft_val', 9);
            document.getElementsByName('Backlogs')[0].value = 0; updateValue('backlog_val', 0);
            document.getElementsByName('Projects')[0].value = 3; updateValue('proj_val', 3);
            document.getElementsByName('Certifications')[0].value = 2; updateValue('cert_val', 2);
            document.getElementsByName('Aptitude_Test_Score')[0].value = 88; updateValue('apt_val', 88);
            document.getElementsByName('Internships')[0].value = 2; updateValue('intern_val', 2);
            document.getElementsByName('Gender')[0].value = 'Male';
            document.getElementsByName('Degree')[0].value = 'B.Tech';
        }

        window.onload = function () {

            var prediction = "{{ prediction | default('') }}"

            if (prediction !== "") {
                document.getElementById("resultModal").style.display = "flex"
            }

        }

    </script>

</head>

<body>

    <div class="container">

        <h1 style="font-size: 20px;color: #2c7be5;text-align: center;font-weight:900;">Student Placement Prediction
        </h1>
        <p style="text-align: center;color:gray">By aditya kuril & neel kanani.</p>

        <form method="POST">

            <div class="form-group">
                <label>Age (Importance: Low)</label>
                <input type="range" name="Age" min="18" max="35" value="22" oninput="updateValue('age_val',this.value)">
                <span class="slider-value" id="age_val">22</span>
            </div>

            <div class="form-group">
                <label>CGPA (Importance: 16.5%)</label>
                <input type="range" name="CGPA" min="0" max="10" step="0.1" value="7"
                    oninput="updateValue('cgpa_val',this.value)">
                <span class="slider-value" id="cgpa_val">7</span>
            </div>

            <div class="form-group">
                <label>Communication Skills (Importance: 32.3%)</label>
                <input type="range" name="Communication_Skills" min="1" max="10" value="5"
                    oninput="updateValue('comm_val',this.value)">
                <span class="slider-value" id="comm_val">5</span>
            </div>

            <div class="form-group">
                <label>Coding Skills (Importance: 9.3%)</label>
                <input type="range" name="Coding_Skills" min="1" max="10" value="5"
                    oninput="updateValue('coding_val',this.value)">
                <span class="slider-value" id="coding_val">5</span>
            </div>

            <div class="form-group">
                <label>Soft Skills Rating (Importance: 0.1%)</label>
                <input type="range" name="Soft_Skills_Rating" min="1" max="10" value="5"
                    oninput="updateValue('soft_val',this.value)">
                <span class="slider-value" id="soft_val">5</span>
            </div>

            <div class="form-group">
                <label>Backlogs (Importance: 17.3%)</label>
                <input type="range" name="Backlogs" min="0" max="7" value="0"
                    oninput="updateValue('backlog_val',this.value)">
                <span class="slider-value" id="backlog_val">0</span>
            </div>

            <div class="form-group">
                <label>Projects (Importance: 9.7%)</label>
                <input type="range" name="Projects" min="0" max="10" value="1"
                    oninput="updateValue('proj_val',this.value)">
                <span class="slider-value" id="proj_val">1</span>
            </div>

            <div class="form-group">
                <label>Certifications (Importance: 7.4%)</label>
                <input type="range" name="Certifications" min="0" max="10" value="1"
                    oninput="updateValue('cert_val',this.value)">
                <span class="slider-value" id="cert_val">1</span>
            </div>

            <div class="form-group">
                <label>Aptitude Test Score (Importance: 5.8%)</label>
                <input type="range" name="Aptitude_Test_Score" min="0" max="100" value="50"
                    oninput="updateValue('apt_val',this.value)">
                <span class="slider-value" id="apt_val">50</span>
            </div>

            <div class="form-group">
                <label>Internships (Importance: 0.8%)</label>
                <input type="range" name="Internships" min="0" max="5" value="0"
                    oninput="updateValue('intern_val',this.value)">
                <span class="slider-value" id="intern_val">0</span>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select name="Gender">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="form-group">
                <label>Degree</label>
                <select name="Degree">
                    <option value="B.Tech">B.Tech</option>
                    <option value="BCA">BCA</option>
                    <option value="BSc_IT">BSc_IT</option>
                    <option value="MCA">MCA</option>
                </select>
            </div>

            <br>

            <div style="display: flex; gap: 10px;">
                <button type="submit">Predict Placement</button>
                <button type="button" onclick="fillPlacedExample()" style="background: #28a745;">Placed Example</button>
            </div>

        </form>

    </div>

    {% if prediction %}
    <div id="resultModal" class="modal">

        <div class="modal-content">

            <h2 style="color:darkslategrey;margin-bottom: 50px;font-weight: bolder;">Prediction Result</h2>

            <p id="predictionText">{{ prediction }}</p>

            <div class="modal-buttons">
                <button onclick="window.location.href='/';">Predict Next</button>
            </div>

        </div>

    </div>
    {% endif %}

</body>

</html>
